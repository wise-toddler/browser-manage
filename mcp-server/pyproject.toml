[project]
name = "browser-tabs-mcp"
version = "0.1.0"
description = "MCP server for browser tab management"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.3.0,<3",
    "pillow>=12.3.0",
]

[project.scripts]
browser-tabs-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
